name: Inkspect Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: inkspect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Inkspect Code Review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request Inkspect Cloud Engine
        uses: inkspect-code-review/inkspect-action@v1
        with:
          ci-workflow: CI
